# A generic, single database configuration for Alembic migrations.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Sys.path prepending to load application modules
prepend_sys_path = %(here)s

# Timezone used when rendering date within migration file
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py
sourceless = false

# Version location specification
version_locations = %(here)s/alembic/versions

# The default connection URL is dynamically loaded in env.py from app.core.config
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/releasegate_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(asctime)s] [%(levelname)s] [%(name)s] - %(message)s
datefmt = %Y-%m-%d %H:%M:%S
